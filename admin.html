<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sổ Điểm Luyện Đề</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261107b">

  <!-- MathJax: hiển thị công thức LaTeX khi xem lại đề gõ tay -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [["$", "$"]], displayMath: [["$$", "$$"]] },
      svg: { fontCache: "global" },
      startup: { typeset: false }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
</head>
<body>
  <div class="khung">

    <!-- ===== MÀN 1: BẢNG ĐIỂM ===== -->
    <section id="man-bang-diem">
      <header class="dau-trang">
        <div>
          <span class="nhan">Dành cho gia sư</span>
          <h1>Sổ Điểm Luyện Đề</h1>
        </div>
        <div class="hang-nut">
          <a class="nut nut-chinh" href="tao-de.html">Tạo đề từ PDF</a>
          <a class="nut" href="index.html">Về trang học sinh</a>
        </div>
      </header>

      <!-- Kho đề: đề xếp theo thư mục, mỗi đề có link riêng để gửi học sinh (không cần mật khẩu) -->
      <section class="kho-de" aria-labelledby="tieu-de-kho">
        <div class="dau-kho">
          <h2 id="tieu-de-kho">Kho đề</h2>
          <input type="search" id="tim-de" placeholder="Tìm đề hoặc thư mục" aria-label="Tìm đề hoặc thư mục">
          <button type="button" class="nut nut-nho" id="nut-sap-xep">Sắp xếp thư mục</button>
        </div>
        <p class="goi-y-kho" id="goi-y-kho">Bấm vào thư mục để mở. Dòng <b>Cả thư mục</b>: link cho học sinh làm mọi đề trong thư mục; các dòng dưới: link riêng từng đề.</p>
        <div id="ds-thu-muc"></div>
        <div class="hang-nut" id="thanh-luu-kho" hidden>
          <button type="button" class="nut" id="nut-them-thu-muc">+ Thư mục mới</button>
          <button type="button" class="nut nut-chinh" id="nut-luu-kho">Lưu vào thư mục project</button>
          <button type="button" class="nut" id="nut-huy-sap-xep">Hủy</button>
        </div>
        <p class="dem-cau" id="tt-luu-kho"></p>
      </section>

      <form class="hang-cong-cu" id="form-mat-khau">
        <label for="o-mat-khau" class="nhan">Mật khẩu</label>
        <input type="password" id="o-mat-khau" autocomplete="current-password" placeholder="Mật khẩu trong Code.gs">
        <button type="submit" class="nut nut-chinh">Tải kết quả</button>
        <span class="dem-cau" id="trang-thai"></span>
      </form>

      <div id="noi-dung" hidden>
        <div class="hang-cong-cu">
          <label for="loc-de" class="nhan">Đề</label>
          <select id="loc-de"></select>
          <label for="loc-tim" class="nhan">Tìm</label>
          <input id="loc-tim" placeholder="Tên hoặc lớp">
        </div>

        <div class="the-so" id="the-so"></div>

        <div class="ti-le" id="ti-le" hidden></div>

        <div class="cuon-ngang">
          <table>
            <thead>
              <tr>
                <th data-sap="nopLuc">Nộp lúc</th>
                <th data-sap="hoTen">Họ tên</th>
                <th data-sap="lop">Lớp</th>
                <th data-sap="tenDe">Đề</th>
                <th data-sap="diem" class="so">Điểm</th>
                <th data-sap="diem1" class="so">P.I</th>
                <th data-sap="diem2" class="so">P.II</th>
                <th data-sap="diem3" class="so">P.III</th>
                <th data-sap="giayDaLam" class="so">Thời gian</th>
                <th>Bài làm</th>
              </tr>
            </thead>
            <tbody id="bang"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ===== MÀN 2: BÀI LÀM CỦA MỘT HỌC SINH ===== -->
    <section id="man-xem-bai" hidden>
      <div class="thanh-xem-bai">
        <button type="button" class="nut" id="nut-dong-bai">← Bảng điểm</button>
        <div class="hang-nut">
          <span class="dem-cau" id="xb-vi-tri"></span>
          <button type="button" class="nut" id="nut-bai-truoc">‹ Bài trước</button>
          <button type="button" class="nut" id="nut-bai-sau">Bài sau ›</button>
        </div>
      </div>
      <header class="dau-trang">
        <div>
          <span class="nhan" id="xb-de"></span>
          <h1 id="xb-ten"></h1>
        </div>
      </header>
      <div id="xb-noi-dung"></div>
    </section>
  </div>

  <!-- ?v=...: số phiên bản. Sửa file trong css/ hoặc js/ thì tăng số này ở cả 3 trang (index, admin, tao-de),
       để trình duyệt tải bản mới thay vì dùng bản cũ đã lưu (GitHub Pages cho giữ tới 10 phút). -->
  <script src="js/config.js?v=20261107b"></script>
  <script src="js/tai-de.js?v=20261107b"></script>
  <script src="js/cham-diem.js?v=20261107b"></script>
  <script src="js/xem-lai.js?v=20261107b"></script>
  <script src="js/kho-de.js?v=20261107b"></script>
  <script src="js/admin.js?v=20261107b"></script>
</body>
</html>
